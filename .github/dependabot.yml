# Weekly dependency checks. Security fixes open PRs right away; routine
# minor/patch updates are grouped into one PR per ecosystem so they stay
# easy to review. Major versions are left out of the groups on purpose:
# the first grouped run bundled Django 5->6 and TypeScript 6->7 in with
# everything else, both broke CI, and the safe updates got stuck with them.
# Each major bump now arrives as its own PR to take or leave.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
