# Monthly dependency checks, kept quiet on purpose (the owner found a
# dozen open bot PRs at once annoying): each ecosystem gets at most ONE
# grouped PR a month with every minor/patch update in it. Major versions
# are skipped entirely - the first grouped run bundled Django 5->6 and
# TypeScript 6->7, both broke CI; those upgrades get done deliberately by
# hand instead. Security fixes still arrive on their own (GitHub security
# updates, not this schedule).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # A new Python version (3.12 -> 3.15) can break libraries like rembg/
      # onnxruntime that ship per-Python builds, and CI doesn't build the
      # image - upgrade Python deliberately, not via a bot PR.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
