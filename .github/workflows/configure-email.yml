name: Configure email sender (self-hosted, on-demand)

# Manually-triggered only - switches the production outgoing-mail identity
# from the personal Gmail account (doanchetoidriz@gmail.com) used at
# launch to the business one (broffice.bg@gmail.com), using a fresh app
# password generated on that account 2026-08-13. Stored as a GitHub Actions
# secret (BROFFICE_EMAIL_APP_PASSWORD) rather than committed anywhere -
# GitHub automatically masks any log output matching a secret's value, so
# this workflow is safe to inspect afterward even though it handles a real
# credential.
#
# Only recreates backend/celery-worker/celery-beat (the services that
# actually read EMAIL_* env vars) - frontend/Caddy is untouched, so this
# doesn't cause the storefront-facing downtime a full redeploy would.

on:
  workflow_dispatch:

jobs:
  configure-email:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Current EMAIL_*/ADMIN_ORDER_EMAIL lines in .env (password line redacted)
        # Added after the first run of this workflow surfaced EMAIL_BACKEND
        # still on the console fallback in production - it was never
        # actually switched to SMTP, unlike local dev's .env. Checking the
        # full picture before touching anything else, rather than guessing
        # at what else might be missing/wrong (EMAIL_HOST, EMAIL_PORT,
        # EMAIL_USE_TLS could all be unset too).
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          Get-Content .env | Where-Object { $_ -match '^EMAIL_|^DEFAULT_FROM_EMAIL|^ADMIN_ORDER_EMAIL' } | ForEach-Object {
            if ($_ -match '^EMAIL_HOST_PASSWORD=') { 'EMAIL_HOST_PASSWORD=<redacted>' } else { $_ }
          }

      - name: Update EMAIL_BACKEND / EMAIL_HOST / EMAIL_HOST_USER / EMAIL_HOST_PASSWORD / DEFAULT_FROM_EMAIL / ADMIN_ORDER_EMAIL in .env
        # The redacted inspection step above found the actual root causes:
        # EMAIL_BACKEND was still the console fallback, EMAIL_HOST was
        # blank, and ADMIN_ORDER_EMAIL was a leftover placeholder
        # (admin@broffice.bg - not either real admin address) - confirmed
        # by the real test email in this same run actually landing there
        # instead of the two real addresses. EMAIL_PORT/EMAIL_USE_TLS were
        # already correctly set.
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          BROFFICE_EMAIL_APP_PASSWORD: ${{ secrets.BROFFICE_EMAIL_APP_PASSWORD }}
        run: |
          $envPath = ".env"
          $content = Get-Content $envPath
          $changed = @()
          $updated = $content | ForEach-Object {
            if ($_ -match '^EMAIL_BACKEND=') {
              $changed += 'EMAIL_BACKEND'
              'EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend'
            } elseif ($_ -match '^EMAIL_HOST=') {
              $changed += 'EMAIL_HOST'
              'EMAIL_HOST=smtp.gmail.com'
            } elseif ($_ -match '^EMAIL_HOST_USER=') {
              $changed += 'EMAIL_HOST_USER'
              'EMAIL_HOST_USER=broffice.bg@gmail.com'
            } elseif ($_ -match '^EMAIL_HOST_PASSWORD=') {
              $changed += 'EMAIL_HOST_PASSWORD'
              "EMAIL_HOST_PASSWORD=$env:BROFFICE_EMAIL_APP_PASSWORD"
            } elseif ($_ -match '^DEFAULT_FROM_EMAIL=') {
              $changed += 'DEFAULT_FROM_EMAIL'
              'DEFAULT_FROM_EMAIL=broffice.bg@gmail.com'
            } elseif ($_ -match '^ADMIN_ORDER_EMAIL=') {
              $changed += 'ADMIN_ORDER_EMAIL'
              'ADMIN_ORDER_EMAIL=doanchetoidriz@gmail.com,broffice.bg@gmail.com'
            } else {
              $_
            }
          }
          # Set-Content -Encoding UTF8 writes a BOM on PS 5.1, which
          # python-dotenv would then choke on for whichever key ends up
          # first in the file (same class of issue found earlier today in
          # diagnostics.yml) - write it BOM-less explicitly instead.
          [System.IO.File]::WriteAllLines(
            (Resolve-Path $envPath),
            $updated,
            [System.Text.UTF8Encoding]::new($false)
          )
          Write-Host "Updated in .env (values not shown): $($changed -join ', ')"

      - name: Recreate backend/celery services so the new .env takes effect
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          docker compose -f docker-compose.prod.yml up -d --force-recreate backend celery-worker celery-beat

      - name: Verify the new sender identity is live (non-secret fields only)
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $lines = @(
            'from django.conf import settings',
            'print("EMAIL_BACKEND:", settings.EMAIL_BACKEND)',
            'print("EMAIL_HOST:", settings.EMAIL_HOST)',
            'print("EMAIL_HOST_USER:", settings.EMAIL_HOST_USER)',
            'print("DEFAULT_FROM_EMAIL:", settings.DEFAULT_FROM_EMAIL)',
            'print("EMAIL_HOST_PASSWORD set:", bool(settings.EMAIL_HOST_PASSWORD))'
          )
          $pythonSource = $lines -join "`n"
          $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($pythonSource))
          docker compose -f docker-compose.prod.yml exec -T backend python manage.py shell -c "import base64; exec(base64.b64decode('$b64').decode('utf-8'))"

      - name: Send a real test email (proves SMTP actually works, not just that settings look right)
        # Cyrillic text embedded directly in this PowerShell script body
        # broke the runner's own script parsing (the generated .ps1 file
        # got mangled - confirmed by an actual run: "Unexpected token" on
        # what should have been the subject string). Plain ASCII sidesteps
        # it entirely - fine here since this is a throwaway connectivity
        # test, not real customer-facing content.
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $lines = @(
            'from django.conf import settings',
            'from django.core.mail import send_mail',
            'send_mail("BRoffice test email", "If you can read this, outgoing email works.", settings.DEFAULT_FROM_EMAIL, settings.ADMIN_NOTIFICATION_EMAILS, fail_silently=False)',
            'print("Sent OK to:", settings.ADMIN_NOTIFICATION_EMAILS)'
          )
          $pythonSource = $lines -join "`n"
          $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($pythonSource))
          docker compose -f docker-compose.prod.yml exec -T backend python manage.py shell -c "import base64; exec(base64.b64decode('$b64').decode('utf-8'))"
