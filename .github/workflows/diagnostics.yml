name: Diagnostics (self-hosted, on-demand)

# Manually-triggered only (workflow_dispatch) - never runs on a push, and
# only someone with write access to this repo can trigger it. Exists so
# the production machine can be inspected remotely (read-only, nothing
# destructive here) without needing physical access to it - added
# 2026-08-12 after a real incident where the client reported the live
# site failing for a caller in a different city, with nobody able to get
# to the machine to check it in person.

on:
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Container status and restart history
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          docker compose -f docker-compose.prod.yml ps
          Write-Host "---"
          foreach ($svc in "frontend","backend","postgres","redis","celery-worker","celery-beat") {
            $name = "broffice-app-$svc-1"
            docker inspect $name --format "$name  started={{.State.StartedAt}}  restarts={{.RestartCount}}  status={{.State.Status}}  health={{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}"
          }

      - name: Docker engine / Desktop status
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          docker info --format "ServerVersion={{.ServerVersion}}  Containers={{.Containers}}  ContainersRunning={{.ContainersRunning}}"
          Get-Process "Docker Desktop" -ErrorAction SilentlyContinue | Select-Object Id, StartTime

      - name: System boot time and uptime
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Last boot: $($os.LastBootUpTime)"
          Write-Host "Now:       $(Get-Date)"
          Write-Host "Uptime:    $((Get-Date) - $os.LastBootUpTime)"

      - name: Recent frontend (Caddy) logs
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: docker compose -f docker-compose.prod.yml logs frontend --tail 100 --timestamps

      - name: Recent backend logs
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: docker compose -f docker-compose.prod.yml logs backend --tail 60 --timestamps

      - name: Local reachability check (from the machine itself)
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          # No -SkipCertificateCheck - that flag doesn't exist in Windows
          # PowerShell 5.1 (this runner's shell, confirmed from earlier
          # runs). Not needed anyway now that the certificate is genuinely
          # valid - default validation actually proves it works.
          for ($i = 1; $i -le 5; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "https://www.broffice.bg/" -TimeoutSec 8 -UseBasicParsing
              Write-Host "attempt ${i}: $($r.StatusCode)"
            } catch {
              Write-Host "attempt ${i}: FAILED - $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 1
          }

      - name: Watchdog log (last 40 lines)
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $log = "C:\broffice-backups\watchdog.log"
          if (Test-Path $log) {
            Get-Content $log -Tail 40
          } else {
            Write-Host "No watchdog log found at $log"
          }

      - name: Disk space
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: Get-PSDrive C | Select-Object Used, Free
