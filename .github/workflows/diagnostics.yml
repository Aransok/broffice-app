name: Diagnostics (self-hosted, on-demand)

# Manually-triggered only (workflow_dispatch) - never runs on a push, and
# only someone with write access to this repo can trigger it. Exists so
# the production machine can be inspected remotely (read-only, nothing
# destructive here) without needing physical access to it - added
# 2026-08-12 after a real incident where the client reported the live
# site failing for a caller in a different city, with nobody able to get
# to the machine to check it in person.
#
# One deliberate exception to "read-only": re-registering the Docker
# Watchdog task if it's missing. Found 2026-08-13 that it was never
# actually registered on production (a real gap - no auto-recovery was
# running this whole time), and it doesn't need admin rights to fix, so
# it's safe to do here rather than needing someone physically present.

on:
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Ensure Docker Watchdog task is registered
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $existing = Get-ScheduledTask -TaskName "BRoffice Docker Watchdog" -ErrorAction SilentlyContinue
          if ($existing) {
            Write-Host "Already registered - state: $($existing.State)"
          } else {
            Write-Host "Not registered - registering it now."
            & ".\scripts\register-watchdog-task.ps1" -DeployDir (Get-Location).Path -LogFile "C:\broffice-backups\watchdog.log"
          }

      - name: Container status and restart history
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          docker compose -f docker-compose.prod.yml ps
          Write-Host "---"
          foreach ($svc in "frontend","backend","postgres","redis","celery-worker","celery-beat") {
            $name = "broffice-app-$svc-1"
            docker inspect $name --format "$name  started={{.State.StartedAt}}  restarts={{.RestartCount}}  status={{.State.Status}}  health={{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}"
          }

      - name: Docker engine / Desktop status
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          docker info --format "ServerVersion={{.ServerVersion}}  Containers={{.Containers}}  ContainersRunning={{.ContainersRunning}}"
          Get-Process "Docker Desktop" -ErrorAction SilentlyContinue | Select-Object Id, StartTime

      - name: System boot time and uptime
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Last boot: $($os.LastBootUpTime)"
          Write-Host "Now:       $(Get-Date)"
          Write-Host "Uptime:    $((Get-Date) - $os.LastBootUpTime)"

      - name: Recent frontend (Caddy) logs
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: docker compose -f docker-compose.prod.yml logs frontend --tail 100 --timestamps

      - name: Recent backend logs
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: docker compose -f docker-compose.prod.yml logs backend --tail 60 --timestamps

      - name: Local reachability check (from the machine itself)
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          # No -SkipCertificateCheck - that flag doesn't exist in Windows
          # PowerShell 5.1 (this runner's shell, confirmed from earlier
          # runs). Not needed anyway now that the certificate is genuinely
          # valid - default validation actually proves it works.
          for ($i = 1; $i -le 5; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "https://www.broffice.bg/" -TimeoutSec 8 -UseBasicParsing
              Write-Host "attempt ${i}: $($r.StatusCode)"
            } catch {
              Write-Host "attempt ${i}: FAILED - $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 1
          }

      - name: Watchdog log (last 40 lines)
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $log = "C:\broffice-backups\watchdog.log"
          if (Test-Path $log) {
            Get-Content $log -Tail 40
          } else {
            Write-Host "No watchdog log found at $log"
          }

      - name: Machine's actual current public IP (vs DNS record 212.5.157.161)
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ip = (Invoke-WebRequest -Uri "https://api.ipify.org" -TimeoutSec 10 -UseBasicParsing).Content
          Write-Host "Actual current public IP: $ip"
          Write-Host "DNS record points to:     212.5.157.161"
          if ($ip.Trim() -eq "212.5.157.161") {
            Write-Host "MATCH - DNS is correct."
          } else {
            Write-Host "MISMATCH - DNS is pointing at the wrong IP!"
          }

      - name: What's listening on ports 80, 81, 443 - with process names
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          Get-NetTCPConnection -State Listen -LocalPort 80,81,443 -ErrorAction SilentlyContinue |
            Select-Object LocalAddress, LocalPort, OwningProcess,
              @{N="ProcessName";E={(Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).ProcessName}} |
            Format-Table -AutoSize | Out-String -Width 200

      - name: IIS (W3SVC) status and any HTTPS bindings
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          Get-Service W3SVC -ErrorAction SilentlyContinue | Select-Object Name, Status, StartType
          Write-Host "--- HTTP.sys URL reservations (any process, not just IIS) ---"
          cmd /c "netsh http show urlacl 2>&1"
          Write-Host "--- IIS HTTPS site bindings, if IIS is even present ---"
          # Found 2026-08-13: the Get-WebBinding cmdlet can exist (as a stub)
          # without the WebAdministration provider actually being registered
          # - it then throws a terminating error that -ErrorAction
          # SilentlyContinue does NOT suppress, which crashed this step and
          # every step after it in the same job. try/catch actually catches it.
          if (Get-Command Get-WebBinding -ErrorAction SilentlyContinue) {
            try {
              Get-WebBinding -Protocol https -ErrorAction Stop
            } catch {
              Write-Host "Get-WebBinding failed (consistent with IIS not being really set up): $($_.Exception.Message)"
            }
          } else {
            Write-Host "IIS management cmdlets not available (consistent with IIS not being really set up)."
          }

      - name: Disk space
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: Get-PSDrive C | Select-Object Used, Free

      - name: Nightly backup folder contents (did last night's 01:00 run actually happen)
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $root = "C:\broffice-backups"
          if (Test-Path $root) {
            Get-ChildItem $root -Directory | Sort-Object Name -Descending | ForEach-Object {
              $dbFile = Join-Path $_.FullName "database.sql"
              $size = if (Test-Path $dbFile) { "{0} KB" -f [math]::Round((Get-Item $dbFile).Length / 1KB) } else { "MISSING" }
              Write-Host "$($_.Name)  database.sql=$size"
            }
          } else {
            Write-Host "No $root folder found at all yet."
          }

      - name: Published products with client_price 0 or missing (real counts, read-only)
        # Added 2026-08-13 - client reported seeing "a lot" of €0.00 items
        # after the EUR-only display change. That change only touched
        # formatting, not data, so this checks what's actually stored
        # instead of guessing at the scope.
        #
        # Piping the script via stdin (`$script | docker compose exec ...`)
        # reliably prepended a UTF-8 BOM that Python's exec() rejected
        # (SyntaxError: invalid non-printable character U+FEFF) - confirmed
        # by actually running it, twice, including after setting both
        # $OutputEncoding and [Console]::OutputEncoding to a BOM-less
        # UTF8Encoding (neither changed the outcome at all - same error,
        # byte for byte). Passing the code as a base64 argument instead
        # sidesteps text-encoding entirely (base64 is pure ASCII).
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $lines = @(
            'from products.models import Product',
            'published = Product.objects.filter(status=Product.STATUS_PUBLISHED)',
            'zero_or_missing = (published.filter(client_price__isnull=True) | published.filter(client_price=0)).distinct()',
            'print("Total published products:", published.count())',
            'print("Published with client_price 0 or missing:", zero_or_missing.count())',
            'for p in zero_or_missing.order_by("item_number")[:100]:',
            '    cat = p.category.name if p.category else None',
            '    print(f"#{p.item_number} | {p.name[:70]} | external_id={p.external_id} | client_price={p.client_price} | admin_price={p.admin_price} | category={cat}")'
          )
          $pythonSource = $lines -join "`n"
          $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($pythonSource))
          # Plain `python -c` skips Django's settings bootstrap entirely
          # (confirmed by actually running it: ImproperlyConfigured, settings
          # not configured) - `manage.py shell -c` does that setup first,
          # same as the interactive shell would, so use that instead.
          docker compose -f docker-compose.prod.yml exec -T backend python manage.py shell -c "import base64; exec(base64.b64decode('$b64').decode('utf-8'))"

      - name: Rejected orders with a still-active matching client promo (read-only)
        # Added 2026-08-14 - deactivate_used_item_promotions previously only
        # ran on confirm, not reject, so a one-time "+ Промоция" client
        # discount tied to a rejected order's items stayed active and could
        # leak into a later, unrelated order for the same client (real
        # client report). The fix (running it on reject too) only covers
        # rejections from here on - this checks whether any REJECTED order
        # still has a matching active promo left over from before that fix
        # shipped, so the leftover state can be confirmed before cleaning
        # it up by hand rather than guessed at.
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $lines = @(
            'from orders.models import Order',
            'from promotions.models import Promotion',
            'rejected = Order.objects.filter(status=Order.STATUS_REJECTED, user__isnull=False)',
            'hits = 0',
            'for order in rejected:',
            '    product_ids = set(order.items.values_list("product_id", flat=True)) - {None}',
            '    if not product_ids:',
            '        continue',
            '    promos = Promotion.objects.filter(user_id=order.user_id, product_id__in=product_ids, active=True)',
            '    for promo in promos:',
            '        hits += 1',
            '        print(f"order={order.number} user={order.user.username} promo_id={promo.id} promo={promo.name!r} product_id={promo.product_id}")',
            'print(f"Total stale active promotions found: {hits}")'
          )
          $pythonSource = $lines -join "`n"
          $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($pythonSource))
          docker compose -f docker-compose.prod.yml exec -T backend python manage.py shell -c "import base64; exec(base64.b64decode('$b64').decode('utf-8'))"

      - name: Scheduled task status (backup, restore watcher, watchdog)
        # Moved last - this step has some intermittent crash after
        # printing results (cause not fully pinned down yet), which
        # stops all later steps. Doesn't affect the data it does print.
        #
        # Switched from `schtasks /query` to Get-ScheduledTask for all
        # three - confirmed 2026-08-14 that schtasks /query itself returns
        # "Access is denied" for the two SYSTEM-run tasks under this
        # runner's own (non-admin) account, even though they were
        # successfully created moments earlier from a real Administrator
        # session - a query-permission gap, not evidence the tasks are
        # missing. Get-ScheduledTask goes through the Task Scheduler
        # COM/WMI API instead of the legacy schtasks.exe query path, which
        # already worked fine for the Watchdog task under this same
        # account - using it for all three avoids the false negative.
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Continue"
          Get-ScheduledTask -TaskName "BRoffice Nightly Backup", "BRoffice Restore Watcher", "BRoffice Docker Watchdog" -ErrorAction SilentlyContinue |
            Select-Object TaskName, State | Format-Table -AutoSize
